# OSV-Scanner accepted-risk register
# ---------------------------------------------------------------------------
# Every advisory listed here is a KNOWN, TRIAGED, and ACCEPTED risk. The
# dependency-audit CI job (.github/workflows/dependency-audit.yml) runs
# `osv-scanner scan source --lockfile=bun.lock` and FAILS on any advisory that
# is NOT in this register. So: a green audit means "zero un-triaged vulns",
# not "zero vulns".
#
# Rules for adding an entry (keep this register honest):
#   1. Prefer a real fix first — bump the declared dependency, or pin a patched
#      version in the root `overrides` block of package.json. Only fall back to
#      an IgnoredVulns entry when a fix is genuinely unavailable or unsafe.
#   2. Every entry MUST have a `reason` explaining WHY it is safe to defer.
#   3. Re-evaluate on each Dependabot bump; delete entries once a fix lands.
#      `osv-scanner` prints an "unused ignores" list for entries whose advisory
#      no longer matches anything in the lockfile — that list is the delete
#      queue for rule 3, and it does not fail the build, so it must be read.
#   4. A `reason` that names a BLOCKER ("waiting on X to widen its range") is a
#      claim with an expiry date. Re-check the blocker itself, not just whether
#      the advisory still fires — nothing in the tooling tells you a reason has
#      gone stale, and on 2026-09-04 three of the four blockers named in this
#      file turned out to have already been removed upstream, one of them
#      holding a CVSS 8.7.
#
# ---------------------------------------------------------------------------
# Reconciled 2026-09-04: 10 entries -> 1.
#
#   * brace-expansion / picomatch / ajv — SEVEN entries, all reported as unused
#     ignores; every coexisting copy had floated onto a patched version.
#     Deleted under rule 3.
#   * minimatch — THREE entries (one CVSS 8.7). The reason blamed 3.x/9.x/10.x
#     coexisting; the real blocker was an EXACT `minimatch: "10.1.2"` inside
#     eslint-plugin-sonarjs@3.0.7. 4.2.0 widened it to `^10.2.5`. FIXED.
#   * @hono/node-server — ONE entry. The reason said the fix (2.0.5) was a major
#     outside @modelcontextprotocol/sdk's `^1.19.9`; it had been backported to
#     1.19.15, inside that range. Pinned to 1.19.17. FIXED.
#   * langsmith x4 + uuid x1 — FIVE entries, one root cause: @langchain/core
#     0.3.80 declared `langsmith: "^0.3.67"`, which excluded every fix. Moving
#     the adapter to @langchain/core 1.x (and @langchain/openai 1.x) resolves
#     langsmith 0.10.1 and drops uuid@10 from the tree entirely. FIXED — see the
#     CHANGELOG breaking note, since this is a major bump of a published adapter.
#   * fast-uri and qs — new advisories against the exact versions `overrides`
#     held; re-pinned forward (3.1.6 / 6.16.0) under rule 1 rather than listed.
#
# What that left was a single advisory. If you are adding a second one,
# the bar is rule 1: show that a real fix was tried first.
#
# Reconciled 2026-10-03 (27 CI advisories + 3 published since): every one with a
# patched version was fixed — undici / fast-uri / ip-address / hono / basic-ftp
# re-pinned in `overrides` (basic-ftp crosses to 6.x: get-uri@8.0.1, the latest,
# still declares `^5.3.1`, no 5.x fix exists, and 6.0's one break is a
# safer default for separate transfer hosts that get-uri never asks for), and
# brace-expansion / markdown-it refreshed in the lockfile inside their ranges.
# ONE entry was added, braces, because no fixed version exists at all.
#
# Reconciled 2026-10-07 (5 new advisories, each with a patched version): all
# fixed under rule 1 in `overrides`, none listed — smol-toml 1.8.0 -> 1.9.0
# (GHSA-r4xh-jqrq-34v2), sharp 0.35.4 -> 0.35.5 (GHSA-wq5f-xc86-pv6w, its
# bundled librsvg), and three new pins: proxy-addr 2.0.8 (GHSA-jqcg-44mw-7w3h),
# source-map-js 1.2.2 (GHSA-68fv-2mgg-jv7q) and @modelcontextprotocol/sdk
# 1.31.0 (GHSA-6qxp-vccf-f47h). Each fix is inside the range its dependents
# declare, except sharp for @huggingface/transformers' `^0.33.5`, which the
# existing sharp pin already overrode.
#
# Reconciled 2026-10-09 (3 new advisories, all against handlebars 4.7.9, all
# fixed in 4.7.10): fixed under rule 1 by moving the existing `overrides` pin
# 4.7.9 -> 4.7.10, inside `@vibe-agent-toolkit/resources`' declared `^4.7.8`.
