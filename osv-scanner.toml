# OSV-Scanner accepted-risk register
# ---------------------------------------------------------------------------
# Every advisory listed here is a KNOWN, TRIAGED, and ACCEPTED risk. The
# dependency-audit CI job (.github/workflows/dependency-audit.yml) runs
# `osv-scanner scan source --lockfile=bun.lock` and FAILS on any advisory that
# is NOT in this register. So: a green audit means "zero un-triaged vulns",
# not "zero vulns".
#
# Rules for adding an entry (keep this register honest):
#   1. Prefer a real fix first — bump the declared dependency, or pin a patched
#      version in the root `overrides` block of package.json. Only fall back to
#      an IgnoredVulns entry when a fix is genuinely unavailable or unsafe.
#   2. Every entry MUST have a `reason` explaining WHY it is safe to defer.
#   3. Re-evaluate on each Dependabot bump; delete entries once a fix lands.
#
# A stale entry is worse than no entry: it silently swallows the advisory if a
# future resolution drags a vulnerable copy back into the tree. When in doubt,
# delete the entry and let CI re-raise it.
#
# Snapshot when this register was last reconciled: eleven entries were deleted
# because the tree now resolves patched copies and the ignores had become dead
# weight — brace-expansion (1.1.18 / 2.1.4 / 5.0.9), picomatch (2.3.2 / 4.0.5)
# and ajv (6.15.0 / 8.20.0) are at or above every published fix line, so the
# "coexisting majors make a global pin unsafe" argument no longer applies to
# any of them. minimatch and @hono/node-server were fixed outright rather than
# ignored (see below). Earlier reconciliations eliminated the transitive
# protobufjs@6 chain by replacing the native onnxruntime-node embedding backend
# with onnxruntime-web (WASM), and pinned 20+ other transitive advisories to
# patched versions in the package.json `overrides` block.
#
# Two load-bearing pins live in `overrides` and exist ONLY to keep advisories
# out of the tree — do not "clean them up":
#   * minimatch = 10.2.6 — eslint-plugin-sonarjs@3.0.7 hard-pins the exact
#     version "10.1.2" (not a range), which carries GHSA-3ppc-4f35-3m26 (8.7),
#     GHSA-23c5-xmqv-rm74 and GHSA-7r86-cg39-jmmj. No lockfile refresh can move
#     an exact pin, so the flat override is the fix. It also collapses the
#     formerly-coexisting 3.1.5 / 9.0.9 copies onto 10.2.6; lint, typecheck and
#     the full test suite pass on the collapsed tree. The alternative — bumping
#     eslint-plugin-sonarjs to 4.x, which declares `^10.2.5` — introduces ~113
#     new lint errors from new rules and is tracked as separate work.
#   * @hono/node-server = 1.19.17 — the previous 1.19.13 pin was itself what
#     held GHSA-frvp-7c67-39w9 in the tree. The fix landed in 1.19.15, well
#     inside @modelcontextprotocol/sdk's declared `^1.19.9`, so no major bump
#     was needed.
# ---------------------------------------------------------------------------

# --- esbuild (dev-server file read) ------------------------------------------
# The advisory affects `esbuild serve` (the dev server). VAT never runs the
# esbuild dev server; esbuild is build-time-only tooling (via vite/tsx) and is
# not present in any published package. The vulnerable copy is `vite/esbuild`
# at 0.27.7; the fix is 0.28.1, outside vite@7's declared `^0.27.0`, so it
# requires a breaking vite major bump. A patched esbuild@0.28.2 already
# coexists in the tree for the non-vite consumers.
[[IgnoredVulns]]
id = "GHSA-g7r4-m6w7-qqqr"
reason = "esbuild advisory affects the `esbuild serve` dev server, which VAT never runs. Build-time-only, not shipped. Vulnerable copy is vite@7's pinned esbuild@0.27.7; fix (0.28.1) is outside vite's declared `^0.27.0` and needs a breaking vite major bump."

# --- uuid (missing buffer bounds check) --------------------------------------
# uuid@10 is dev/test-only (reached via langsmith/@langchain/core). The fix is
# a breaking major bump to uuid@11; not worth destabilizing the langchain
# adapter's tooling for a dev-only, buf-parameter-only issue VAT never triggers.
[[IgnoredVulns]]
id = "GHSA-w5hq-g745-h8pq"
reason = "uuid bounds check only affects the optional `buf` argument, which VAT never passes. Dev/test-only (langsmith path). Fix requires breaking uuid@11 major bump."

# --- langsmith (SSRF / prototype pollution / deserialization) ----------------
# langsmith is ONLY reachable through @vibe-agent-toolkit/runtime-langchain,
# which is an opt-in runtime adapter and is NOT in the dependency closure of the
# `vibe-agent-toolkit` package that end consumers install. The vulnerable copy
# (0.3.87) is pinned transitively by @langchain/core@0.3.x; forcing a patched
# langsmith major risks breaking @langchain/core. These do not reach the CLI /
# resources / skills surface that adopters actually consume.
[[IgnoredVulns]]
id = "GHSA-3644-q5cj-c5c7"
reason = "langsmith reachable only via the opt-in runtime-langchain adapter, not in the consumer `vibe-agent-toolkit` install closure. Pinned by @langchain/core@0.3.x."
