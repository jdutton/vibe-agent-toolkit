reason = "brace-expansion exponential-time expansion of consecutive `{}` groups. Per-major fixes exist (1.1.16 / 2.1.2) but bun's flat `overrides` map cannot pin per-major and 1.x/2.x coexist under minimatch@3 and minimatch@9. VAT-authored globs only. Re-evaluate if bun gains path-scoped overrides or when glob majors converge."
[[IgnoredVulns]]
id = "GHSA-mh99-v99m-4gvg"
