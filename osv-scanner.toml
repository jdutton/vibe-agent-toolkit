# OSV-Scanner accepted-risk register
# ---------------------------------------------------------------------------
# Every advisory listed here is a KNOWN, TRIAGED, and ACCEPTED risk. The
# dependency-audit CI job (.github/workflows/dependency-audit.yml) runs
# `osv-scanner scan source --lockfile=bun.lock` and FAILS on any advisory that
# is NOT in this register. So: a green audit means "zero un-triaged vulns",
# not "zero vulns".
#
# Rules for adding an entry (keep this register honest):
#   1. Prefer a real fix first — bump the declared dependency, or pin a patched
#      version in the root `overrides` block of package.json. Only fall back to
#      an IgnoredVulns entry when a fix is genuinely unavailable or unsafe.
#   2. Every entry MUST have a `reason` explaining WHY it is safe to defer.
#   3. Re-evaluate on each Dependabot bump; delete entries once a fix lands.
#      `osv-scanner` prints an "unused ignores" list for entries whose advisory
#      no longer matches anything in the lockfile — that list is the delete
#      queue for rule 3, and it does not fail the build, so it must be read.
#
# Snapshot when this register was last reconciled: the transitive protobufjs@6
# chain (previously via the native onnxruntime-node backend, loaded through
# @xenova/transformers@2 / @huggingface/transformers@3 → onnxruntime-web@1.14
# → onnx-proto) was eliminated by replacing the native embedding backend with
# onnxruntime-web (WASM) directly — no onnx-proto in the resolution path, so
# onnxruntime-web resolves the patched protobufjs@7 line unconditionally. 20+
# other transitive advisories were pinned to patched versions in package.json
# `overrides`. The advisories below are what remains — fixes that require an
# unsafe global major-version pin, a transitive exact-pin we do not control, or
# dev/test-only packages that are not in the published consumer graph.
#
# Reconciled again on 2026-09-04 against the rule-3 delete queue: the
# brace-expansion (1.x/2.x/5.x), picomatch (2.x/4.x) and ajv (6.x/8.x) entries
# were all reported as unused ignores — every coexisting copy of those three had
# independently floated onto a patched version (brace-expansion 1.1.18 / 2.1.4 /
# 5.0.9, picomatch 2.3.2 / 4.0.5, ajv 6.15.0 / 8.20.0), so their seven entries
# were deleted. `fast-uri` and `qs` were re-pinned in `overrides` (3.1.5→3.1.6,
# 6.15.2→6.16.0) rather than registered, per rule 1.
# ---------------------------------------------------------------------------

# --- minimatch (ReDoS) --------------------------------------------------------
# NOT a coexisting-majors problem any more: minimatch 3.1.5 and 9.0.9 are still
# in the tree but neither is affected, and the tree already carries a PATCHED
# 10.2.6 that every `^10.2.2` consumer (typescript-estree, test-exclude,
# rimraf/glob) resolves to. The single vulnerable copy is minimatch@10.1.2,
# pulled by exactly one package: eslint-plugin-sonarjs@3.0.7, which declares it
# as an EXACT pin (`"minimatch": "10.1.2"`), not a range — so no amount of
# floating or deduping moves it. bun's `overrides` map is flat and unscoped, so
# pinning minimatch globally to 10.2.6 to reach that one copy would also drag
# the minimatch@3 and minimatch@9 consumers across two major versions.
# All three advisories are ReDoS in glob-pattern matching against attacker-
# controlled globs — VAT only ever matches globs it authors, and the affected
# copy is reachable only from ESLint at lint time, never from a published
# package. Consumers of the published packages re-resolve VAT's floating ranges
# and pick up patched minimatch independently of this lockfile.
# DELETE THESE when eslint-plugin-sonarjs widens or bumps its minimatch pin.
[[IgnoredVulns]]
id = "GHSA-23c5-xmqv-rm74"
reason = "minimatch ReDoS in the single copy pinned EXACTLY by eslint-plugin-sonarjs@3.0.7 (10.1.2); every other consumer already resolves the patched 10.2.6. Lint-time only, VAT-authored globs. Re-evaluate when eslint-plugin-sonarjs bumps its pin."
[[IgnoredVulns]]
id = "GHSA-3ppc-4f35-3m26"
reason = "minimatch ReDoS in the single copy pinned EXACTLY by eslint-plugin-sonarjs@3.0.7 (10.1.2); every other consumer already resolves the patched 10.2.6. Lint-time only, VAT-authored globs. Re-evaluate when eslint-plugin-sonarjs bumps its pin."
[[IgnoredVulns]]
id = "GHSA-7r86-cg39-jmmj"
reason = "minimatch ReDoS in the single copy pinned EXACTLY by eslint-plugin-sonarjs@3.0.7 (10.1.2); every other consumer already resolves the patched 10.2.6. Lint-time only, VAT-authored globs. Re-evaluate when eslint-plugin-sonarjs bumps its pin."

# --- @hono/node-server (serve-static path traversal on Windows) ---------------
# The vulnerable surface is the `@hono/node-server/serve-static` subpath export.
# The only thing that pulls @hono/node-server into the tree is
# @modelcontextprotocol/sdk@1.26.0, which (a) declares `^1.19.9`, so the 2.0.5
# fix is out of its declared range and a global pin would force a semver-major
# adapter swap under it, and (b) imports only `getRequestListener` from the
# package root, in `server/streamableHttp.js` — it never imports serve-static.
# VAT's single MCP consumer (packages/gateway-mcp) uses StdioServerTransport
# exclusively and never constructs the Streamable HTTP transport, so the module
# is not loaded at all. The advisory is additionally Windows-only static-file
# serving, which VAT never does.
[[IgnoredVulns]]
id = "GHSA-frvp-7c67-39w9"
reason = "@hono/node-server path traversal is in the `serve-static` export, which is never imported: @modelcontextprotocol/sdk uses only `getRequestListener` for its Streamable HTTP transport, and VAT's gateway-mcp is stdio-only. Fix (2.0.5) is a major bump outside the SDK's declared `^1.19.9`, so a global pin is unsafe. Re-evaluate when the MCP SDK widens its range."

# --- esbuild (dev-server file read) ------------------------------------------
# The advisory affects `esbuild serve` (the dev server). VAT never runs the
# esbuild dev server; esbuild is build-time-only tooling (via vite/tsx) and is
# not present in any published package. Fix requires an esbuild 0.x major bump
# that would force a Vite upgrade.
[[IgnoredVulns]]
id = "GHSA-g7r4-m6w7-qqqr"
reason = "esbuild advisory affects the `esbuild serve` dev server, which VAT never runs. Build-time-only, not shipped. Fix needs a breaking esbuild/vite bump."

# --- uuid (missing buffer bounds check) --------------------------------------
# uuid@10 is dev/test-only (reached via langsmith/@langchain/core). The fix is
# a breaking major bump to uuid@11; not worth destabilizing the langchain
# adapter's tooling for a dev-only, buf-parameter-only issue VAT never triggers.
[[IgnoredVulns]]
id = "GHSA-w5hq-g745-h8pq"
reason = "uuid bounds check only affects the optional `buf` argument, which VAT never passes. Dev/test-only (langsmith path). Fix requires breaking uuid@11 major bump."

