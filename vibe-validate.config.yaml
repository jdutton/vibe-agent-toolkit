# vibe-validate configuration
# Documentation: https://github.com/jdutton/vibe-validate
#
# ── Two tiers, one step list ──────────────────────────────────────────────────
#
# Every step below belongs to one of two tiers:
#
#   pre-commit  build · typecheck · lint
#               What `.husky/pre-commit` (`vibe-validate pre-commit`) runs on
#               every commit: seconds when turbo's and ESLint's caches are warm.
#               It catches what breaks the tree for everyone (a red build, a type
#               error, a lint error); which tests to run when is the committer's
#               call (`bun run test:unit`), and CI runs every tier.
#
#   full        everything, including the steps marked `runScope: ci`.
#               What CI runs (`validate.yml`, generated from this file) and what
#               `bun run validate` runs locally — that script sets `CI=1`, which
#               is the only switch vibe-validate exposes for `runScope`.
#
# `runScope: ci` is vibe-validate's supported per-step gate (`ValidationStepSchema`
# in @vibe-validate/config): a step so marked is skipped whenever `process.env.CI`
# is unset. There is no `--phase`, no second config file, and no per-hook step
# list in vibe-validate 0.20 — this is the mechanism.
#
# ⚠️ The vibe-validate cache is keyed on the git TREE HASH alone, and a step
# skipped by runScope is recorded as passed (0 s). A pre-commit-tier pass on a
# tree therefore reads as a cached pass for the full tier on that same tree.
# That is why `bun run validate` carries `--force`: the full command never
# replays a verdict that may have been the half-gate's. The pre-commit hook
# keeps the cache (a full pass is a superset of what it needs). It replays a
# cached RED too: after a red `bun run validate`, `git commit` on the same tree
# fails on the full tier's step, even one the hook does not run. Bypass:
# `VV_FORCE_EXECUTION=1 git commit` (not enforced).
#
# Integration and system tests run in the full tier only: together they were
# 232 s of a 321 s warm gate (72 %), serialised, and growing linearly with file
# count — the two slow tiers are what PR CI is for.

# CI matrix configuration
ci:
  nodeVersions: ['24']
  os: ['ubuntu-latest', 'windows-latest']
  failFast: false
  dependencyLockCheck:
    runOn: pre-commit

# Hooks configuration
hooks:
  preCommit:
    secretScanning:
      enabled: true

validation:
  phases:
    # Everything that WRITES build output runs here, in order: turbo's build, then
    # typecheck, then the `vat build` dogfood that writes this repo's packaged
    # artifacts, then their verification. ESLint runs here too, serially: it is
    # the long pole cold, and vibe-validate 0.20 names the first step IN CONFIG
    # ORDER as the failure when a parallel sibling fails and the rest are killed —
    # in the parallel phase a killed ESLint would be blamed for another step's red.
    - name: 'Build'
      parallel: false
      steps:
        - name: 'Build packages'
          command: 'bun run build'

        - name: 'TypeScript type checking'
          command: 'bun run typecheck'

        - name: 'ESLint'
          command: 'bun run lint'

        - name: 'VAT dogfood: build skills and claude artifacts'
          command: 'bun run vat build --cwd packages/vat-development-agents'
          description: 'Builds vat-development-agents skills and claude plugin artifacts (dogfoods vat build). Full tier only.'
          runScope: ci

        - name: 'VAT dogfood: verify all artifacts'
          command: 'bun run vat verify --cwd packages/vat-development-agents'
          description: 'Verifies vat-development-agents resources, skills, and claude artifacts (dogfoods vat verify). Full tier only.'
          runScope: ci

    # Checks over what the Build phase wrote, run concurrently. No step here may
    # write anything a sibling reads (not enforced): a step that builds goes above,
    # and a `vat` step goes in the next phase. When one fails, vibe-validate 0.20
    # kills the rest and may name a killed sibling as the failure: read every
    # step's printed output, not `failedStep` (docs/contributing/traps.md).
    - name: 'Checks'
      parallel: true
      steps:

        - name: 'Dependency check'
          command: 'bun run dependency-check'
          description: 'Validates dependencies are correctly declared (unused, missing, misplaced). Full tier only.'
          runScope: ci

        - name: 'Unused exports'
          command: 'bun run unused-exports'
          description: 'knip unused-export ratchet: a new unused export or a stale allowlist entry fails. Full tier only.'
          runScope: ci

        - name: 'Dependency advisory scope: zod'
          command: 'bun run check:zod-advisory-scope'
          description: 'Holds the osv-scanner.toml zod entry to zod@3.25.76: red on another affected zod, and red once 3.25.76 or the entry is gone. Full tier only.'
          runScope: ci

        - name: 'Repository structure validation'
          command: 'bun run validate-structure'
          description: 'Validates repo structure conventions (no runtime /examples, no /staging, etc.). Full tier only.'
          runScope: ci

        - name: 'Package publish readiness'
          command: 'bun run pre-publish -- --skip-git-checks'
          description: 'Validates packages are ready for publishing (metadata, files, workspace deps, etc.). Full tier only.'
          runScope: ci

        - name: 'Code duplication check'
          command: 'bun run duplication-check'
          description: 'Compares every file with every other, so it has no incremental form. Full tier only.'
          runScope: ci

    # The `vat` dogfood steps, one at a time: each populates the machine-wide
    # projection store (SQLite, one writer at a time with a 5 s busy timeout), and
    # five cold populations at once on a CI runner can time a writer out. Serial,
    # the first populates and the rest reuse it.
    - name: 'VAT dogfood'
      parallel: false
      steps:
        - name: 'Documentation validation'
          command: 'bun run vat resources validate'
          description: 'Validates markdown link integrity across entire project. Full tier only.'
          runScope: ci

        - name: 'VAT dogfood: resource projection checks'
          command: 'bun run vat resources check'
          description: 'Runs the SQL assertions under resources.checks (dogfoods vat resources check). Full tier only.'
          runScope: ci

        - name: 'VAT dogfood: audit quality gate'
          command: 'bun run guard:audit-quality'
          description: 'Turns advisory `vat audit` into a hard gate over this repo (see audit-quality-gate.ts). Full tier only.'
          runScope: ci

        - name: 'Skills validation: vat-development-agents'
          command: 'bun run vat skills validate packages/vat-development-agents'
          description: 'Validates the SKILL.md files this package ships (unified: resources + skill-specific rules). The repo root declares no `skills:`, so a root run examines nothing and refuses. Full tier only.'
          runScope: ci

        - name: 'Skills validation: vat-example-cat-agents'
          command: 'bun run vat skills validate packages/vat-example-cat-agents'
          description: 'Validates the SKILL.md files this package ships. Full tier only.'
          runScope: ci

    # Unit tests get the machine to themselves: vitest already runs a worker per
    # core, and sharing them with the Checks phase starved a 15 s test into a
    # timeout (measured at load 67). No `--only`: it drops the build dependencies
    # from each test task's turbo hash, so a package's tests would replay a cached
    # pass after a package it depends on changed. Re-entering the build the Build
    # phase ran is a run of cache hits.
    - name: 'Unit Tests'
      parallel: false
      steps:
        - name: 'Unit tests'
          command: 'bun run test:unit'
          description: 'Unit tests only. Coverage is collected in a dedicated CI job (.github/workflows/coverage.yml) so it does not slow local validation or the Windows CI matrix. Full tier only: run `bun run test:unit` when the change calls for it.'
          runScope: ci

    - name: 'Integration Tests'
      parallel: false
      steps:
        - name: 'Integration tests'
          command: 'bun run test:integration'
          description: 'Full tier only — see the header.'
          runScope: ci

    - name: 'System Tests'
      parallel: false
      steps:
        - name: 'End-to-end system tests'
          command: 'bun run test:system'
          description: 'Runs complete end-to-end workflows testing the entire system. Full tier only — see the header.'
          runScope: ci
