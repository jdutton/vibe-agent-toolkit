# vibe-agent-toolkit configuration
# Configuration for vat CLI tool

version: 1

resources:
  # Global excludes (apply to all scanning)
  exclude:
    - "node_modules/**"
    - "**/test-fixtures/**"
    - "**/test/fixtures/**"
    - "**/dist/**"
    - "docs/plans/**"
    # Skill-test eval suites are TEST INPUT, not project docs. Their fixtures are
    # deliberately-broken SKILL.md files (used to verify vat-skill-review catches
    # the violations) and must not be link/portability-validated as real docs.
    # Mirrored in eslint.config.js + validate-repo-structure.ts — keep in sync.
    - "**/resources/skills/evals/**"
    # Golden snapshots of BUILT skill output (packaged-output-drift.system.test.ts).
    # They are byte-for-byte copies of dist/ artifacts, so their links are already
    # rewritten/stripped for the packaged layout and do not resolve from here —
    # validating them as project docs would report drift as broken links.
    - "**/test/golden/**"

  # Collections group files and apply specific validation rules
  # Note: All **/*.md files are scanned by default (implicit)
  # Collections determine which validation rules apply to which files
  collections:
    # Architecture documentation
    architecture-docs:
      include:
        - "docs/architecture/**/*.md"
      validation:
        frontmatterSchema: "schemas/architecture-frontmatter.json"
        mode: permissive  # Warn if frontmatter invalid, but don't fail

    # User guides and tutorials
    guides:
      include:
        - "docs/guides/**/*.md"
      validation:
        frontmatterSchema: "schemas/guide-frontmatter.json"
        mode: permissive

    # Package README files
    package-readmes:
      include:
        - "packages/*/README.md"
        - "packages/vibe-agent-toolkit/README.md"
        # Ships in the utils tarball and is the adopter-facing rule table for the
        # `./eslint` subpath — governed by the same schema as any package README.
        # It used to match the glob above as `packages/eslint-plugin/README.md`;
        # moving the rules into `utils/eslint/` silently dropped it out.
        - "packages/utils/eslint/README.md"
      validation:
        frontmatterSchema: "schemas/package-readme-frontmatter.json"
        mode: permissive

    # Agent Skills (SKILL.md files)
    skills:
      include:
        - "**/resources/skills/SKILL.md"
        - "packages/*/SKILL.md"
      validation:
        frontmatterSchema: "packages/agent-skills/schemas/skill-frontmatter.json"
        mode: strict  # Skills MUST have valid frontmatter

    # Claude Code subtree-scoped rule guards. `paths:` is the only field Claude Code
    # reads to decide when a rule fires — strict mode catches a typo'd/missing key
    # before it ships as a guard that validates green and silently never activates.
    claude-rules:
      include:
        - ".claude/rules/**/*.md"
      validation:
        frontmatterSchema: "schemas/rules-frontmatter.json"
        mode: strict

  # Per-code severity overrides available via resources.validation.severity (see docs/validation-codes.md)
