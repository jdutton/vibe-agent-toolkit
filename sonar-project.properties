# SonarCloud configuration.
#
# Analysis runs in SonarCloud Automatic Analysis mode (GitHub-app bound, no CI
# scanner). This file supplies analysis-scope EXCLUSIONS only — project binding,
# sources, and language detection are handled automatically.
#
# Skill-test eval suites (resources/skills/evals/**) are TEST INPUT, not production
# code. Their fixtures are deliberately broken or placeholder by design — a fake
# plugin with a sloppy script used to exercise `vat audit`, a half-finished starter
# config the vat-knowledge-resources eval asks an agent to complete, intentionally
# non-portable SKILL.md files used to verify vat-skill-review catches the violations.
# They are already excluded from every other validator (eslint.config.js,
# validate-repo-structure.ts, the repo-root + vat-development-agents
# vibe-agent-toolkit.config.yaml, and the project-validation system test); SonarQube
# was the last validator still scanning them. Keep all sites in sync if this path moves.
sonar.exclusions=**/resources/skills/evals/**
