# The verdict facet's expected deltas — committed and reviewed.
#
# Every entry is keyed by subject ALIAS (never an adopter name), verb (a row
# name: a verb, or `resources-query:<file>`), and the changelog bullet that
# explains it. `vat-lab verdict compare` checks this file BOTH ways: an observed
# delta no entry declares fails, and a declared delta that did not occur fails.
# `baseline` is the baseline arm's vat version every entry is a move away from;
# a compare against any other baseline is refused.
#
# `findings: itemized` declares that the candidate itemizes exactly the findings the baseline
# published only as tallies — the same count per code and per severity, none removed
# (compare.ts `itemizedTallies`). It covers no code the baseline did not tally.
#
# A finding is declared by its full identity. Where its location — a path inside the subject —
# would name the subject, `locationDigest` (the SHA-256 of the location; a compare prints it
# beside every observed finding) pins the same identity without committing the path.
#
# `refusal` declares a move in the refusal codes an unmeasured row's document published;
# `(uncoded)` is an older build's refusal sentence, which carries no code.
#
# `changelog: <file>#<id>` names the ONE bullet of <file> carrying `<!-- verdict-delta:<id> -->`.
#
# Schema and rules: packages/lab/src/facets/verdict/deltas.ts.
# How to run a crucible pass: packages/lab/docs/facets.md ("verdict").
