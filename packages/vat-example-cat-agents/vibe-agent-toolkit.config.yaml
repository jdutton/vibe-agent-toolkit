# vibe-agent-toolkit configuration for vat-example-cat-agents
# This package is an example demonstrating VAT agent archetypes — the SKILL.md
# legitimately links to sibling agent reference docs under ../agents/ to guide
# Claude Code through the archetype implementations. Those references are text
# pointers, not bundled content.

version: 1

skills:
  include: ["resources/skills/SKILL.md"]
  defaults:
    targets: ['claude-code']
  config:
    vat-example-cat-agents:
      # 1, not 0: SKILL.md was split for progressive disclosure, and a reference
      # file the bundle does not contain is a pointer to nothing. Depth 1 bundles
      # the sibling reference docs; the `../agents/` pointers the header comment
      # describes stay out through excludeReferencesFromBundle below, which is the
      # mechanism that actually expresses "text pointer, not bundled content".
      linkFollowDepth: 1
      excludeReferencesFromBundle:
        rules:
          - patterns: ["**/agents/**"]
