version: 1
prompts:
  # --- vat-audit ---
  - id: vat-audit-pos
    forSkillId: vat-audit
    prompt: Run vat audit on this plugin and explain how to read the compatibility output.
    authoring: hand
    kind: positive
    expectedBehavior:
      description: >-
        The vat-audit skill loads and walks through running vat audit, the
        --compat flag, and interpreting the surface-compatibility output.
      invocationSignals:
        - vat audit
  - id: vat-audit-neg
    forSkillId: vat-audit
    prompt: Write a haiku about autumn leaves.
    authoring: hand
    kind: negative
    expectedBehavior:
      description: >-
        The vat-audit skill does NOT load; the assistant writes a haiku instead.
      invocationSignals:
        - vat audit

  # --- vat-skill-authoring ---
  - id: vat-skill-authoring-pos
    forSkillId: vat-skill-authoring
    prompt: Help me write the frontmatter and body for a new SKILL.md file.
    authoring: hand
    kind: positive
    expectedBehavior:
      description: >-
        The vat-skill-authoring skill loads and guides SKILL.md frontmatter,
        body structure, references, and packaging options.
      invocationSignals:
        - SKILL.md
  - id: vat-skill-authoring-neg
    forSkillId: vat-skill-authoring
    prompt: What is the capital of France?
    authoring: hand
    kind: negative
    expectedBehavior:
      description: >-
        The vat-skill-authoring skill does NOT load; the assistant answers the
        geography question directly.
      invocationSignals:
        - SKILL.md

