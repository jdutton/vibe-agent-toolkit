name: Vitest Heap-Budget Guard

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  guard-test-heap:
    name: Vitest heap-budget guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: ./.github/actions/setup

      # NET_AVAILABLE as in validate.yml: the guard re-runs the CLI's integration
      # and system tiers, and the rag suites there embed with the ONNX model,
      # which a fresh runner must download. Without it they skip and their heap
      # goes unmeasured.
      - name: Run heap-budget guard
        run: bun run guard:test-heap
        env:
          GH_TOKEN: ${{ github.token }}
          NET_AVAILABLE: "1"
