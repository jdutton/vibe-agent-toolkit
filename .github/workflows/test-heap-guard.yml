name: Vitest Heap-Budget Guard

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  guard-test-heap:
    name: Vitest heap-budget guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: ./.github/actions/setup

      # NET_AVAILABLE as in validate.yml: the guard re-runs the CLI's integration
      # and system tiers, and the rag suites there embed with the ONNX model,
      # which a fresh runner must download. Without it they skip and their heap
      # goes unmeasured. It also turns on every other network-gated suite in
      # those tiers (the npm registry, GitHub clones, external link checks), so
      # this guard depends on those hosts as validate.yml does. GH_TOKEN (the
      # job's read-only token) mirrors validate.yml's step, so the network
      # suites run under the same environment in both places.
      - name: Run heap-budget guard
        run: bun run guard:test-heap
        env:
          GH_TOKEN: ${{ github.token }}
          NET_AVAILABLE: "1"
