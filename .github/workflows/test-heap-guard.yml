name: Vitest Heap-Budget Guard

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  guard-test-heap:
    name: Vitest heap-budget guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Run heap-budget guard
        run: bun run guard:test-heap
