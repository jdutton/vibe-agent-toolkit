# Dependency Audit — fails on any advisory not in the osv-scanner.toml register.
#
# Complements the main Validation Pipeline (validate.yml). This job scans the
# committed bun.lock with OSV-Scanner and enforces the accepted-risk register at
# ./osv-scanner.toml: a green run means "zero un-triaged vulnerabilities". To
# accept a new advisory, add a documented `[[IgnoredVulns]]` entry to that file;
# to fix one, bump the dependency or pin it in the root package.json `overrides`.
#
# osv-scanner is the pinned release binary, verified against the checksum the
# release publishes, rather than a marketplace action (action-ref drift) or
# `go install` (which compiles it from source through proxy.golang.org — twice
# in one day that proxy failed mid-stream on a transitive module and the
# scan never ran).
name: Dependency Audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly, Monday 06:00 UTC — catches newly-disclosed advisories against the
    # existing lockfile even when no code changes land.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv-scan:
    name: OSV-Scanner (bun.lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install OSV-Scanner
        env:
          OSV_VERSION: v2.4.0
          OSV_SHA256: 15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0
        run: |
          curl -sSfL --retry 3 -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum --check --strict
          install -m 0755 osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: Scan lockfile against accepted-risk register
        run: osv-scanner scan source --lockfile=bun.lock --config=osv-scanner.toml
