# Dependency Audit — fails on any advisory not in the osv-scanner.toml register.
#
# Complements the main Validation Pipeline (validate.yml). This job scans the
# committed bun.lock with OSV-Scanner and enforces the accepted-risk register at
# ./osv-scanner.toml: a green run means "zero un-triaged vulnerabilities", and
# every ignore is in use, in date, and covers only the versions it accepts. To
# accept a new advisory, add a documented `[[IgnoredVulns]]` entry to that file
# and its row in ACCEPTED_ADVISORIES (packages/dev-tools/src/osv-ignore-register.ts);
# to fix one, bump the dependency or raise the range the published package
# declares. A root package.json `overrides` pin fixes only this repo's tree for
# anything a published package reaches, so each pin needs its OVERRIDE_REGISTER
# row (packages/dev-tools/src/override-register.ts), held by `check:overrides`.
#
# osv-scanner is the pinned release binary, verified against the checksum the
# release publishes, rather than a marketplace action (action-ref drift) or
# `go install` (which compiles it from source through proxy.golang.org — twice
# in one day that proxy failed mid-stream on a transitive module and the
# scan never ran).
name: Dependency Audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly, Monday 06:00 UTC — catches newly-disclosed advisories against the
    # existing lockfile even when no code changes land.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv-scan:
    name: OSV-Scanner (bun.lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install OSV-Scanner
        env:
          OSV_VERSION: v2.4.0
          OSV_SHA256: 15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL --retry 3 -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum --check --strict
          install -m 0755 osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version

      # The register check reads the scan through VAT's dev-tools, so it needs the toolchain.
      - name: Setup toolchain
        uses: ./.github/actions/setup

      # ONE scan, with an EMPTY config, so nothing is filtered: osv-scanner.toml is not read here
      # but judged below, against OSV's own report. An ignore suppresses every package and range
      # OSV lists under its id, so the scope check has to see the unfiltered data. Exit 1 means
      # "advisories found", which is expected; anything above it is the scanner failing.
      - name: Scan lockfile with an empty config
        run: |
          : > "$RUNNER_TEMP/osv-empty.toml"
          set +e
          osv-scanner scan source --lockfile=bun.lock --config="$RUNNER_TEMP/osv-empty.toml" --format json > "$RUNNER_TEMP/osv-report.json"
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then exit "$status"; fi

      # Red on: an advisory no entry ignores; an ignored advisory against a package or version its
      # ACCEPTED_ADVISORIES row does not accept; an entry the scan never reports (unused); an entry
      # past its ignoreUntil. The offline half (pairing, accepted versions still in bun.lock) runs
      # in the full gate as `bun run check:osv-ignores`.
      - name: Hold every advisory to the accepted-risk register
        run: bun run check:osv-scan "$RUNNER_TEMP/osv-report.json"
