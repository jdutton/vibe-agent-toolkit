name: Coverage Reporting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  coverage:
    name: Upload Coverage to Codecov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: ./.github/actions/setup

      # vitest directly, not through `vibe-validate run`: the wrapper's capture
      # dropped vitest's own summary on a long run, so a red here showed no
      # failing file — the exit code and the reporter verdicts are the record.
      - name: Run tests with coverage
        run: bun run test:coverage
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: true
          verbose: true
