name: Publish Packages

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Determine if stable
          if [[ "$VERSION" == *"-"* ]]; then
            echo "is_stable=false" >> $GITHUB_OUTPUT
          else
            echo "is_stable=true" >> $GITHUB_OUTPUT
          fi

      # The tag is what triggered this run; the manifest is what `npm publish`
      # reads. They are two different numbers unless something checks, and
      # until this step nothing did: pushing `v0.2.1` on a commit whose
      # manifests read `0.2.0-rc.7` would have published `0.2.0-rc.7@latest`,
      # with the tag's version used only for the dist-tag and the log line.
      # First, before any network or build time is spent, because a wrong tag
      # is the one failure that must never reach the publish step.
      #
      # `pre-publish --tag` below re-asserts this alongside the release-readiness
      # checks; this step exists so the answer arrives in seconds.
      - name: Assert the tag names the manifest version
        env:
          TAG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          MANIFEST_VERSION=$(node -p "require('./package.json').version")
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match root package.json version $MANIFEST_VERSION. Nothing was published. Delete the tag, bump with 'bun run bump-version', and tag the commit that carries that version."
            exit 1
          fi
          echo "Tag v$TAG_VERSION matches the manifest."

      - name: Setup toolchain
        uses: ./.github/actions/setup
        with:
          registry-url: 'https://registry.npmjs.org'
          build: 'false'

      # Fails in seconds instead of ~13 minutes. npm masks write-authorization failures on
      # `PUT` as a 404 that claims the package "is not in this registry", so a dead token
      # surfaces at the publish step as a bogus missing-package error, after the whole build
      # and pre-publish suite has already run. Check the credential before spending that.
      #
      # ⚠️ This catches an ABSENT or EXPIRED token, and nothing more. `whoami` is a READ, so
      # a token that authenticates but cannot write — no publish grant, or 2FA enforced with
      # no bypass, which is the `EOTP` that cost rc.5 its third attempt — passes this step and
      # still fails at publish. A green preflight means "the credential exists", never "the
      # publish will succeed". There is no cheap read that proves write access, so the gap is
      # stated rather than papered over.
      - name: Verify npm credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if ! npm_user=$(npm whoami 2>&1); then
            echo "::error::NPM_TOKEN did not authenticate. npm said: ${npm_user}"
            echo "::error::Rotate the secret, then re-run: gh secret set NPM_TOKEN --repo ${{ github.repository }}"
            echo "::error::Do NOT delete and re-push the tag — this failure is upstream of the npm push."
            exit 1
          fi
          echo "Authenticated to npm as ${npm_user}"
          # Informational only. A token can authenticate and still lack write access to a
          # given package — note that `vibe-agent-toolkit` is unscoped, so a grant covering
          # only the @vibe-agent-toolkit scope does not include it.
          echo "Packages this token can reach:"
          npm access list packages 2>&1 | head -40 || true

      - name: Build all packages
        run: bun run build

      - name: Validate version
        run: bun run validate-version

      - name: Determine version type and npm tags
        id: version_type
        run: bun run tsx packages/dev-tools/src/determine-publish-tags.ts ${{ steps.version.outputs.version }}

      # The release-readiness checks used to run only on the maintainer's
      # machine (`bun run pre-release`), and CI trusted that they had. Here they
      # run against the tag that was actually pushed: the marketplace dry-run,
      # the CHANGELOG stamp and section content, and — with `--tag` — that the
      # remote tag exists and names the manifest version.
      - name: Pre-publish and release-readiness checks
        run: bun run pre-publish -- --release-readiness --tag ${{ steps.version.outputs.version }}

      - name: Resolve workspace dependencies
        run: bun run resolve-workspace-deps ${{ steps.version.outputs.version }}

      - name: Publish to npm
        run: bun run publish-with-rollback ${{ steps.version.outputs.version }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          UPDATE_NEXT: ${{ steps.version_type.outputs.update_next }}

      - name: Publish Claude marketplace (next)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run vat claude marketplace publish --cwd packages/vat-development-agents --branch claude-marketplace-next

      - name: Publish Claude marketplace (stable)
        if: steps.version.outputs.is_stable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run vat claude marketplace publish --cwd packages/vat-development-agents

      - name: Extract changelog
        if: steps.version.outputs.is_stable == 'true'
        run: bun run extract-changelog ${{ steps.version.outputs.version }} > /tmp/release-notes.md

      - name: Create GitHub Release
        if: steps.version.outputs.is_stable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "Release v${{ steps.version.outputs.version }}" \
            --notes-file /tmp/release-notes.md
