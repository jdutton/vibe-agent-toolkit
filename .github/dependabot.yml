# Dependabot — grouped, weekly updates (batched PRs per ecosystem, not one PR
# per dependency). Keeps the transitive-vuln surface fresh without flooding the
# queue. New advisories are still gated by the Dependency Audit workflow.
version: 2
updates:
  # npm / Bun workspace (package.json + bun.lock across the monorepo).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # At most one PR per group below, and the last two only open when those
    # packages actually move — so a quiet week is ONE PR, not five.
    open-pull-requests-limit: 3

    # ⛔ No major bump is ever raised as an automated PR.
    #
    # This is the rule that replaced "let majors arrive individually so they can
    # be migrated one at a time". Tried, and it does not work: eslint 8→10,
    # eslint-plugin-unicorn 62→73, zod 3→4 and @vitest/coverage-v8 3→4 each got
    # their own PR, three of the four failed validation on both runners on
    # arrival, and all four sat open because nobody schedules a framework
    # migration off a robot's PR. Closing them fixes nothing — they regenerate
    # the next Monday, which is how the queue reached five open PRs.
    #
    # A major is a migration: it needs a person to pick the week, read the
    # upgrade guide and fix the call sites. Dependabot cannot start that work
    # and its PR is not the place to do it. Run `bunx npm-check-updates` when
    # you want the list.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

    groups:
      # The safe sweep. Minor + patch on packages that have reached 1.0.0, where
      # semver actually promises compatibility. This is the PR that should be
      # mergeable on a green check without reading the diff.
      npm-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          # Pre-1.0 — see `zerover-sdks`.
          - "@lancedb/lancedb"
          - "@anthropic-ai/*"
          # Version-locked pair — see `vitest`.
          - "vitest"
          - "@vitest/*"
        update-types:
          - "minor"
          - "patch"

      # 🚨 Pre-1.0 packages, where `update-types: [minor]` does NOT mean what it
      # says. Under semver, 0.x minor bumps are allowed to break, and these
      # three do: one grouped "minor/patch" PR carried @lancedb/lancedb
      # 0.22.3 → 0.37.1 (whose own release notes head a "🛠 Breaking Changes"
      # section), @anthropic-ai/sdk 0.36.3 → 0.120.0 and
      # @anthropic-ai/claude-agent-sdk 0.1.77 → 0.3.241. The major filter above
      # cannot catch them, because Dependabot classifies 0.22 → 0.37 as a minor.
      #
      # They get their own PR so the breaking ones are visible as breaking,
      # instead of riding in on a sweep labelled safe.
      zerover-sdks:
        patterns:
          - "@lancedb/lancedb"
          - "@anthropic-ai/*"
        update-types:
          - "minor"
          - "patch"

      # vitest and its coverage provider must move TOGETHER: `@vitest/coverage-v8`
      # declares a peer range on the exact vitest minor. Split across two PRs,
      # one of them is incoherent by construction — and because the root pins
      # `vitest` exactly ("3.2.6", no caret) while coverage-v8 carries a caret,
      # the split let coverage-v8 propose moving alone.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - "minor"
          - "patch"

    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  # GitHub Actions used by the workflows in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      # Deliberately NOT split by `update-types`, and majors are NOT ignored
      # here, unlike npm above. An action major changes a workflow step, not the
      # source tree, and the validate matrix exercises every one of them
      # end-to-end before the PR is mergeable — #156 batched four action majors
      # (checkout 6→7, setup-node 6→7, setup-go 5→7, codecov-action 5→7) and
      # passed on both runners. The npm ban exists because a library major
      # breaks the build and needs a human migration; an action major is
      # verified by CI on arrival. This asymmetry is the point, not an oversight.
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
